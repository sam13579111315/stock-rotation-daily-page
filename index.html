<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>持倉總結 2026-08-05</title>
<style>
  body { font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; background:#f0f2f5; margin:0; padding:16px; }
  h1 { font-size:20px; color:#1a237e; margin:4px 0 8px; }
  .card { background:#fff; border-radius:10px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.12); margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { background:#e8eaf6; text-align:left; padding:8px 5px; }
  td { padding:8px 5px; border-bottom:1px solid #eee; }
  .pos { color:#2e7d32; font-weight:bold; }
  .neg { color:#c62828; font-weight:bold; }
  .total { margin-top:10px; font-size:16px; font-weight:bold; }
  .note { color:#888; font-size:12px; margin-top:10px; }
  input { font-size:18px; padding:6px 10px; width:170px; border:1px solid #ccc; border-radius:6px; }
  button { font-size:16px; font-weight:bold; padding:8px 16px; margin-left:8px; background:#1a237e; color:#fff; border:none; border-radius:6px; }
  .resbox { margin-top:10px; font-size:17px; font-weight:bold; color:#1a237e; }
  .perlist { margin-top:6px; font-size:15px; line-height:1.7; }
  .cap { color:#1a237e; font-weight:bold; }
</style>
</head>
<body>
<div class="card">
  <h1>📊 持倉總結 2026-08-05 <span class="note">v2.2</span></h1>
  <label>💰 真實本金 $ <input type="number" id="cap" min="0" step="100" placeholder="例如 50000" inputmode="decimal" oninput="calcCap()" onchange="calcCap()"></label>
  <button type="button" id="calcbtn" onclick="calcCap()">✅ 計算</button>
  <div id="resultbox" class="resbox">— 輸入本金，撳「✅ 計算」—</div>
  <div id="perlist" class="perlist"></div>
</div>
<div class="card">
  <table>
    <tr><th>Ticker</th><th>Type</th><th>方向</th><th>股數</th><th>現價</th><th>市值</th><th>盈虧%</th><th>佔總倉%</th><th>真倉股數</th></tr>
    <tr data-price='295.3500' data-pct='64.9770'><td><b>QQQM</b></td><td>ETF</td><td>LONG</td><td class='sh'>22</td><td>$295.35</td><td>$6,498</td><td class='pos'>+4.26%</td><td class='pct'>65.0%</td><td class='real'>-</td></tr>
    <tr data-price='0' data-pct='35.0230' data-cash='1'><td><b>💰 現金/備用</b></td><td>Cash</td><td>-</td><td>-</td><td>-</td><td>$+3,502</td><td>-</td><td class='pct'>35.0%</td><td class='real'>-</td></tr>
  </table>
  <div class="total pos">💼 總盈虧: $+266（+4.26%）｜基準 $10,000 = 100%</div>
  <div class="note">盈虧% 按策略引擎價（QQQ/GLD）計；股數已換算為 QQQM/GLDM 顯示｜基準本金 $10,000｜引擎: ETF+StockRot+BIL｜<b>v2.2・2026-08-05 00:00 UTC</b></div>
</div>
<script>
  function calcCap() {
    try {
      const rows = document.querySelectorAll('tr[data-price]');
      const inp = document.getElementById('cap');
      const cap = parseFloat(inp.value);
      const rb = document.getElementById('resultbox');
      const pl = document.getElementById('perlist');
      if (!cap || cap <= 0) {
        rows.forEach(r => { const t = r.querySelector('.real'); if (t) t.textContent = '-'; });
        if (rb) rb.textContent = '— 輸入本金，撳「✅ 計算」—';
        if (pl) pl.innerHTML = '';
        return;
      }
      let totalInv = 0, totalCash = 0;
      const lines = [];
      rows.forEach(r => {
        const price = parseFloat(r.dataset.price);
        const pct = parseFloat(r.dataset.pct);
        const t = r.querySelector('.real');
        if (!t) return;
        if (r.dataset.cash) {
          const c = Math.round(cap * pct / 100);
          totalCash = c;
          t.textContent = '$' + c.toLocaleString();
          return;
        }
        const amount = cap * pct / 100;
        const shares = Math.floor(amount / price + 1e-9);
        totalInv += Math.round(amount);
        t.textContent = shares > 0 ? shares + ' 股' : '不足1股';
        t.style.color = shares > 0 ? '#1a237e' : '#c62828';
        const nm = r.querySelector('td') ? r.querySelector('td').textContent : '';
        lines.push('<div>' + (shares > 0 ? '🟢' : '🔴') + ' <b>' + nm + '</b>：買 <b>' + (shares > 0 ? shares + ' 股' : '不足1股') + '</b>（$' + Math.round(amount).toLocaleString() + '）</div>');
      });
      if (rb) rb.textContent = '💼 真倉總投資 $' + totalInv.toLocaleString() + ' ｜ 現金 $' + totalCash.toLocaleString();
      if (pl) pl.innerHTML = lines.join('');
    } catch (e) {
      const rb = document.getElementById('resultbox');
      if (rb) rb.textContent = '⚠️ 計算器出錯: ' + e.message;
    }
  }
  document.addEventListener('DOMContentLoaded', () => {
    const inp = document.getElementById('cap');
    if (inp) { inp.addEventListener('input', calcCap); inp.addEventListener('change', calcCap); }
    const btn = document.getElementById('calcbtn');
    if (btn) btn.addEventListener('click', calcCap);
  });
</script>
<noscript><div style="color:#c62828;font-weight:bold;padding:10px;">⚠️ 呢個頁面需要啟用 JavaScript 先可以計算股數</div></noscript>
</body>
</html>
